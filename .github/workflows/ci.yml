name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les outils
        run: pip install ruff black mypy
      - name: Linter (Ruff)
        run: ruff check app
      - name: Formateur (Black)
        run: black --check app
      - name: Analyse statique (mypy)
        run: mypy app

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Installer les dépendances
        run: npm install
      - name: Linter (ESLint)
        run: npm run lint
      - name: Formateur (Prettier)
        run: npm run format:check
      - name: Analyse statique (tsc)
        run: npm run typecheck

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      # Ce dépôt sera publié en open source, historique compris. Un secret
      # commité aujourd'hui se retire par une rotation de clé et un commit.
      # Découvert au gel, il se retire par une réécriture d'historique.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installer gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Chercher un secret dans l'historique
        run: gitleaks detect --source . --redact --no-banner
